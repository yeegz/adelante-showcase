<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Adelante — a calm, widget-first motivation app for iOS and Android">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF8F1"/>
      <stop offset="1" stop-color="#F0E9DB"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181613"/>
      <stop offset="1" stop-color="#0C0B09"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1280" height="440" fill="url(#paper)"/>

  <!-- forward mark -->
  <g stroke="#15130F" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M80 150 Q120 125 152 137"/>
    <path d="M152 137 L134 120"/>
    <path d="M152 137 L132 157"/>
  </g>

  <text x="78" y="258" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="104" fill="#15130F">Adelante</text>
  <text x="82" y="306" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" fill="#6E655A">A calm, widget-first motivation app for iOS &amp; Android.</text>

  <!-- tags -->
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#5A5248">
    <g>
      <rect x="82" y="342" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.7" stroke="#D9D2C4"/>
      <text x="157" y="368" text-anchor="middle">Flutter</text>
    </g>
    <g>
      <rect x="244" y="342" width="170" height="40" rx="20" fill="#ffffff" fill-opacity="0.7" stroke="#D9D2C4"/>
      <text x="329" y="368" text-anchor="middle">Native widgets</text>
    </g>
    <g>
      <rect x="426" y="342" width="140" height="40" rx="20" fill="#ffffff" fill-opacity="0.7" stroke="#D9D2C4"/>
      <text x="496" y="368" text-anchor="middle">Firebase</text>
    </g>
    <g>
      <rect x="578" y="342" width="160" height="40" rx="20" fill="#ffffff" fill-opacity="0.7" stroke="#D9D2C4"/>
      <text x="658" y="368" text-anchor="middle">Privacy-first</text>
    </g>
  </g>

  <!-- widget card -->
  <g transform="rotate(-3 1010 220)" filter="url(#soft)">
    <rect x="838" y="86" width="344" height="268" rx="30" fill="url(#card)" stroke="#2A2823" stroke-width="1"/>
    <text x="866" y="168" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="30" fill="#F5F1E8">
      <tspan x="866" dy="0">Begin with intention.</tspan>
      <tspan x="866" dy="40">Let the next right</tspan>
      <tspan x="866" dy="40">step be small,</tspan>
      <tspan x="866" dy="40">sincere, and enough.</tspan>
    </text>
    <text x="866" y="316" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#B7B2A8">Adelante</text>
    <rect x="866" y="330" width="34" height="2" rx="1" fill="#B7B2A8"/>
  </g>
</svg>
